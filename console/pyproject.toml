[project]
name = "freight-carrier-console"
version = "0.1.0"
description = "Carrier operator console: authorized sailing withdrawal for the Freight Recovery Exchange demo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.18,<0.1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
