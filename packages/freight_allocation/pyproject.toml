[project]
name = "freight-allocation"
version = "0.1.0"
description = "Recovery allocation: carrier claim checks and the OR-Tools joint allocation behind AllocationSeam"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ortools>=9.11,<10",
    "freight-seams",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

# Non-editable for the same reason as the root project (hidden .pth files on this Mac).
[tool.uv.sources]
freight-seams = { path = "../freight_seams", editable = false }
