[project]
name = "freight-seams"
version = "0.1.0"
description = "Seam contracts between the Exchange lane and the Console lane, so both can be built in parallel"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
